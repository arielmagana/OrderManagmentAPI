name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Build, test, and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore dependencies
        run: dotnet restore OrderManagement.sln

      - name: Restore pinned .NET tools
        run: dotnet tool restore

      - name: Build solution
        run: dotnet build OrderManagement.sln --configuration Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Run unit tests
        run: >-
          dotnet test tests/OrderManagement.UnitTests/OrderManagement.UnitTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --results-directory artifacts/test-results/unit
          --collect "XPlat Code Coverage"

      - name: Run integration and Aspire orchestration tests
        timeout-minutes: 15
        run: >-
          dotnet test tests/OrderManagement.IntegrationTests/OrderManagement.IntegrationTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory artifacts/test-results/integration
          --collect "XPlat Code Coverage"

      - name: Publish API
        run: >-
          dotnet publish src/OrderManagement.Api/OrderManagement.Api.csproj
          --configuration Release
          --no-build
          --output artifacts/publish/api

      - name: Build migration bundle
        run: >-
          dotnet ef migrations bundle
          --project src/OrderManagement.Infrastructure/OrderManagement.Infrastructure.csproj
          --startup-project src/OrderManagement.Api/OrderManagement.Api.csproj
          --configuration Release
          --no-build
          --self-contained
          --target-runtime linux-x64
          --output artifacts/migrations/efbundle

      - name: Validate migration bundle executable
        shell: bash
        run: |
          chmod +x artifacts/migrations/efbundle
          artifacts/migrations/efbundle --help > /dev/null

      - name: Create release metadata and checksums
        shell: bash
        run: |
          mkdir -p artifacts/release/api artifacts/release/migrations
          cp -a artifacts/publish/api/. artifacts/release/api/
          cp artifacts/migrations/efbundle artifacts/release/migrations/efbundle
          migration_to="$(find src/OrderManagement.Infrastructure/Persistence/Migrations \
            -maxdepth 1 -type f -name '[0-9]*_*.cs' ! -name '*.Designer.cs' \
            -printf '%f\n' | sort | tail -1 | sed 's/\.cs$//')"
          test -n "$migration_to"
          grep --fixed-strings --quiet "$migration_to" docs/migrations.md
          printf '%s\n' \
            "commit_sha=${GITHUB_SHA}" \
            "migration_from=database_history" \
            "migration_to=${migration_to}" \
            > artifacts/release/release-metadata.txt
          (cd artifacts/release && sha256sum migrations/efbundle > migration-bundle.sha256)
          cd artifacts/release
          find api -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > api-files.sha256

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn

      # Publish a GitHub check and a job summary even when the test step fails.
      - name: Publish test results
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: .NET test results
          path: artifacts/test-results/**/*.trx
          reporter: dotnet-trx
          fail-on-error: false

      - name: Upload coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-reports
          path: artifacts/test-results/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Upload published API
        if: ${{ success() }}
        uses: actions/upload-artifact@v6
        with:
          name: order-management-api
          path: artifacts/publish/api
          if-no-files-found: error

      - name: Upload immutable release
        if: ${{ success() }}
        uses: actions/upload-artifact@v6
        with:
          name: order-management-release
          path: artifacts/release
          if-no-files-found: error
